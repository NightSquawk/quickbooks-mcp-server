name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep high/critical findings blocking, including the known intuit-oauth
      # query-string/decode-uri-component advisory documented in README.
      - run: npm audit --omit=dev --audit-level=high
