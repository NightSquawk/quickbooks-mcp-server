name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep high/critical production findings blocking. CI also audits a fresh
      # installation of the packed release, where root overrides cannot help.
      - run: npm audit --omit=dev --audit-level=high
